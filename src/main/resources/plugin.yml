name: HorseMount
main: com.ktross.horsemount.HorseMount
version: '${version}'
description: A flexible player mount system for Bukkit-compatible servers.
author: ktross
website: https://github.com/ktross/HorseMount
api-version: '26.2'

commands:
  horsemount:
    description: Show HorseMount help
    aliases: [hm]
    permission: horsemount.help
    permission-message: You do not have permission to use this command.
  mount:
    description: Summon or dismiss your mount
    aliases: [mnt]
    permission: horsemount.mount
    permission-message: You do not have permission to use this command.
  dismount:
    description: Dismiss your mount
    permission: horsemount.dismount
    permission-message: You do not have permission to use this command.
  setmount:
    description: Set your default mount
    permission: horsemount.setmount
    permission-message: You do not have permission to use this command.
  setarmor:
    description: Set your mount's default armor
    permission: horsemount.setarmor
    permission-message: You do not have permission to use this command.
  showmount:
    description: Show your default mount
    permission: horsemount.showmount
    permission-message: You do not have permission to use this command.
  spawnmount:
    description: Spawn an unrideable mount for display
    permission: horsemount.spawnmount
    permission-message: You do not have permission to use this command.

permissions:
  horsemount.*:
    description: Allows access to all HorseMount features
    default: false
    children:
      horsemount.help: true
      horsemount.reload: true
      horsemount.mount: true
      horsemount.dismount: true
      horsemount.setmount: true
      horsemount.setarmor: true
      horsemount.signs.*: true
      horsemount.variant.*: true
      horsemount.style.*: true
      horsemount.color.*: true
      horsemount.armor.*: true
      horsemount.showmount: true
      horsemount.spawnmount: true
  horsemount.signs.*:
    description: Allows access to use and create HorseMount signs
    default: false
    children:
      horsemount.signs.use: true
      horsemount.signs.create: true
  horsemount.variant.*:
    description: Allows access to all mount variants
    default: false
    children:
      horsemount.variant.horse: true
      horsemount.variant.mule: true
      horsemount.variant.donkey: true
      horsemount.variant.skeleton: true
      horsemount.variant.zombie: true
  horsemount.style.*:
    description: Allows access to all mount styles
    default: false
    children:
      horsemount.style.default: true
      horsemount.style.white: true
      horsemount.style.whitefield: true
      horsemount.style.whitedots: true
      horsemount.style.blackdots: true
  horsemount.color.*:
    description: Allows access to all mount colors
    default: false
    children:
      horsemount.color.white: true
      horsemount.color.creamy: true
      horsemount.color.chestnut: true
      horsemount.color.brown: true
      horsemount.color.black: true
      horsemount.color.gray: true
      horsemount.color.darkbrown: true
  horsemount.armor.*:
    description: Allows access to all mount armor
    default: false
    children:
      horsemount.armor.iron: true
      horsemount.armor.gold: true
      horsemount.armor.diamond: true
  horsemount.help:
    description: Allows use of the help command
    default: true
  horsemount.reload:
    description: Allows reloading the plugin configuration
    default: false
  horsemount.mount:
    description: Allows summoning a mount
    default: false
  horsemount.showmount:
    description: Allows showing the default mount
    default: true
  horsemount.spawnmount:
    description: Allows spawning an unrideable display mount
    default: false
  horsemount.dismount:
    description: Allows dismissing mounts
    default: true
  horsemount.signs.use:
    description: Allows use of HorseMount signs
    default: true
  horsemount.signs.create:
    description: Allows creation of HorseMount signs
    default: false
  horsemount.setarmor:
    description: Allows setting default mount armor
    default: true
  horsemount.armor.iron:
    description: Allows use of iron horse armor
    default: false
  horsemount.armor.gold:
    description: Allows use of golden horse armor
    default: false
  horsemount.armor.diamond:
    description: Allows use of diamond horse armor
    default: false
  horsemount.setmount:
    description: Allows setting the default mount
    default: true
  horsemount.variant.horse:
    description: Allows use of horse mounts
    default: false
  horsemount.variant.mule:
    description: Allows use of mule mounts
    default: false
  horsemount.variant.donkey:
    description: Allows use of donkey mounts
    default: false
  horsemount.variant.skeleton:
    description: Allows use of skeleton horse mounts
    default: false
  horsemount.variant.zombie:
    description: Allows use of zombie horse mounts
    default: false
  horsemount.style.default:
    description: Allows use of the default horse style
    default: false
  horsemount.style.white:
    description: Allows use of the white horse style
    default: false
  horsemount.style.whitefield:
    description: Allows use of the white-field horse style
    default: false
  horsemount.style.whitedots:
    description: Allows use of the white-dots horse style
    default: false
  horsemount.style.blackdots:
    description: Allows use of the black-dots horse style
    default: false
  horsemount.color.white:
    description: Allows use of white horses
    default: false
  horsemount.color.creamy:
    description: Allows use of creamy horses
    default: false
  horsemount.color.chestnut:
    description: Allows use of chestnut horses
    default: false
  horsemount.color.brown:
    description: Allows use of brown horses
    default: false
  horsemount.color.black:
    description: Allows use of black horses
    default: false
  horsemount.color.gray:
    description: Allows use of gray horses
    default: false
  horsemount.color.darkbrown:
    description: Allows use of dark brown horses
    default: false
